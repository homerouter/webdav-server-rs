name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libtirpc-dev rpcsvc-proto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features --verbose

      - name: Run WebDAV End-to-End Tests (Debug)
        run: |
          chmod +x tests/e2e_webdav.sh
          bash tests/e2e_webdav.sh target/debug/webdav-server

      - name: Build minimal (no default features)
        run: cargo build --no-default-features --release

  alpine:
    name: Alpine Linux (musl)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    env:
      RUSTFLAGS: "-C target-feature=-crt-static"
    steps:
      - name: Install system dependencies
        run: |
          apk update
          apk add --no-cache \
            bash \
            build-base \
            curl \
            git \
            linux-pam-dev \
            libtirpc-dev \
            rpcsvc-proto
          git config --global --add safe.directory '*'

      - name: Install Rust toolchain via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal -c clippy -c rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features --verbose

      - name: Run WebDAV End-to-End Tests (Debug)
        run: |
          chmod +x tests/e2e_webdav.sh
          bash tests/e2e_webdav.sh target/debug/webdav-server

      - name: Build release (all features)
        run: cargo build --release --all-targets --all-features

      - name: Run WebDAV End-to-End Tests (Release)
        run: bash tests/e2e_webdav.sh target/release/webdav-server

      - name: Build minimal (no default features)
        run: cargo build --no-default-features --release
