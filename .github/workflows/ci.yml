name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libtirpc-dev rpcsvc-proto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --verbose

      - name: Run WebDAV End-to-End Tests (Debug)
        run: |
          chmod +x tests/e2e_webdav.sh
          bash tests/e2e_webdav.sh target/debug/webdav-server

      - name: Build minimal (no default features)
        run: cargo build --no-default-features --release
